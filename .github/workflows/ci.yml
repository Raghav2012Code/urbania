name: build-and-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-raylib

      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        shell: msys2 {0}
        run: cmake --build build

      - name: Test
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

      # Prove the CHECK-based harness can actually fail (#9). A passing
      # negative probe means the test infrastructure is vacuous again.
      - name: Negative harness check
        shell: msys2 {0}
        run: |
          cmake -S . -B cmake-build-negative -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DURBANIA_NEGATIVE_TESTS=ON
          cmake --build cmake-build-negative --target test_harness_negative
          if ./cmake-build-negative/test_harness_negative.exe; then
            echo "ERROR: negative harness unexpectedly passed"
            exit 1
          else
            echo "Negative harness failed as expected"
          fi
